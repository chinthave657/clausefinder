[project]
name = "clausefinder"
version = "0.1.0"
description = "Clause-cited 3GPP answers and release diffs on the NVIDIA agentic stack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "huggingface_hub>=0.26",
    "lancedb>=0.15",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "openai>=1.40",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "python-dotenv>=1.2.3",
]

[project.scripts]
clausefinder = "cli.main:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "agent", "cli"]
