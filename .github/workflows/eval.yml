name: Eval

# Retrieval + answer-quality eval. No index is committed (data/ is
# gitignored), so this cannot run on ordinary CI — it is manual-dispatch
# only, for a runner that has built or downloaded an index first, plus
# NVIDIA_API_KEY for answer/judge calls. The everyday gate is ci.yml
# (lint + unit tests); this workflow is the deep gate (design §6).

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check NVIDIA_API_KEY is available
        id: key_check
        run: echo "has_key=${{ secrets.NVIDIA_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Retrieval eval (recall@5/@20, MRR@10 vs golden set)
        if: steps.key_check.outputs.has_key == 'true'
        run: uv run python eval/retrieval_eval.py

      - name: Answer eval (--limit 5, cheap PR-scale run)
        if: steps.key_check.outputs.has_key == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run python eval/answer_eval.py --limit 5

      - name: CI gate (validator pass rate + gold-cited rate vs baseline)
        if: steps.key_check.outputs.has_key == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run python eval/ci_gate.py

      - name: Skipped — NVIDIA_API_KEY not available (forks)
        if: steps.key_check.outputs.has_key != 'true'
        run: echo "NVIDIA_API_KEY secret not present (likely a fork PR) — skipping eval, not failing the check."
