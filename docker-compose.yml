# ClauseFinder self-host.
#
# Default (CPU) profile: one app container. LLM calls go to build.nvidia.com
# with your own key (BYO NVIDIA_API_KEY in .env — copy .env.example). Only the
# 568M embedding model runs locally, on CPU.
#
#   cp .env.example .env   # add your keys
#   docker compose up --build
#
# The data/ volume must contain a built index (data/index). Build it on the
# host first: `make ingest index`, or run the same commands inside the
# container.

services:
  app:
    build: .
    env_file: .env
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

